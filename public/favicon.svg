<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#e2b268" />
      <stop offset="75%" stop-color="#a17d33" />
      <stop offset="100%" stop-color="#785918" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Coin / Archival Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#gold)" stroke-width="1.8" filter="url(#shadow)" />
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#gold)" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.6" />

  <!-- SS Monogram Sigil -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- First S -->
    <path d="M 28 20 C 22 20, 20 25, 25 29 C 30 33, 27 42, 21 41 C 18 40.5, 17 37, 17 37" />
    <!-- Second S (interlocking) -->
    <path d="M 43 23 C 43 23, 42 20, 39 20 C 33 20, 31 29, 36 33 C 41 37, 39 42, 33 42" />
  </g>

  <!-- Center Diamond Spark -->
  <polygon points="32,13 33.5,15.5 32,18 30.5,15.5" fill="url(#gold)" opacity="0.9" />
  <polygon points="32,46 33.5,48.5 32,51 30.5,48.5" fill="url(#gold)" opacity="0.9" />
</svg>
